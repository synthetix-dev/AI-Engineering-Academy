services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_academy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_academy_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/ai_academy
      DATABASE_SYNC_URL: postgresql://postgres:postgrespassword@postgres:5432/ai_academy
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: production-ai-engineering-academy-secure-key-32bytes-min
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data_storage:/app/data_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_academy_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
